<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Card Body Gradient (UNO Red to Dark Red) -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="50%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <!-- Gold Accent Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>

    <!-- Center Oval Gradient -->
    <linearGradient id="ovalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677E8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7B1FA2" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Card Frame with UNO Red & Gold Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#cardBg)" stroke="url(#goldBorder)" stroke-width="20" filter="url(#dropShadow)" />

  <!-- Inner Dynamic Tilted Brand Oval -->
  <ellipse cx="256" cy="256" rx="200" ry="140" transform="rotate(-18 256 256)" fill="url(#ovalBg)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="8" />

  <!-- Bold Tilted "UF" Text -->
  <g transform="rotate(-6 256 256)">
    <text x="256" y="318" 
          font-family="system-ui, -apple-system, 'Impact', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-style="italic" 
          font-size="210" 
          letter-spacing="-10"
          text-anchor="middle" 
          fill="#FFFFFF" 
          stroke="#000000" 
          stroke-width="12" 
          stroke-linejoin="round"
          filter="url(#textShadow)">UF</text>
  </g>

  <!-- Small "FLIP!" Accent Pill at bottom center -->
  <g transform="translate(196, 400)">
    <rect x="0" y="0" width="120" height="34" rx="17" ry="17" fill="#FFCC00" stroke="#FFFFFF" stroke-width="4"/>
    <text x="60" y="24" 
          font-family="system-ui, -apple-system, 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="18" 
          letter-spacing="2" 
          text-anchor="middle" 
          fill="#15191F">FLIP!</text>
  </g>
</svg>